name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env: {POSTGRES_USER: veylith, POSTGRES_PASSWORD: '${{ secrets.CI_DB_OWNER_PASSWORD }}', POSTGRES_DB: veylith}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U veylith" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+psycopg://veylith_app:${{ secrets.CI_DB_APP_PASSWORD }}@localhost:5432/veylith
      MIGRATION_DATABASE_URL: postgresql+psycopg://veylith:${{ secrets.CI_DB_OWNER_PASSWORD }}@localhost:5432/veylith
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
    defaults:
      run: {working-directory: apps/api}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: apps/api/requirements-dev.txt}
      - run: pip install -r requirements-dev.txt ruff pip-audit
      - name: Create the restricted runtime role
        env: {PGPASSWORD: '${{ secrets.CI_DB_OWNER_PASSWORD }}', APP_PW: '${{ secrets.CI_DB_APP_PASSWORD }}'}
        run: echo "CREATE ROLE veylith_app LOGIN PASSWORD :'app_pw' NOSUPERUSER NOBYPASSRLS" | psql -h localhost -U veylith -d veylith -v app_pw="$APP_PW"
      - run: ruff check app scripts tests
      - run: mypy app scripts --cache-dir=/tmp/mypy
      - run: pip-audit -r requirements.txt
      - name: "Tests (offline, no network access to NVD or CISA is needed)"
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: apps/web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          cp .env.example .env
          # throwaway credentials, generated for this run only
          sed -i "s/change-me-owner-password/$(openssl rand -hex 16)/; s/change-me-app-password/$(openssl rand -hex 16)/; s/change-me-to-a-long-random-value/$(openssl rand -hex 32)/" .env
          docker compose up -d --build
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm ci && npx playwright install --with-deps chromium && npx playwright test
        working-directory: tests/e2e
