name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run: {working-directory: apps/api}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: apps/api/requirements-dev.txt}
      - run: pip install -r requirements-dev.txt ruff pip-audit
      - name: Start PostgreSQL with throwaway credentials
        # Generated for this run only: nothing is stored in the repository or in repository secrets.
        run: |
          OWNER_PW=$(openssl rand -hex 16); APP_PW=$(openssl rand -hex 16); SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$OWNER_PW"; echo "::add-mask::$APP_PW"; echo "::add-mask::$SECRET"
          {
            echo "DATABASE_URL=postgresql+psycopg://veylith_app:${APP_PW}@localhost:5432/veylith"
            echo "MIGRATION_DATABASE_URL=postgresql+psycopg://veylith:${OWNER_PW}@localhost:5432/veylith"
            echo "SECRET_KEY=${SECRET}"
          } >> "$GITHUB_ENV"
          docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=veylith -e POSTGRES_PASSWORD="$OWNER_PW" -e POSTGRES_DB=veylith postgres:16.6-alpine
          until docker exec pg pg_isready -U veylith -d veylith; do sleep 2; done
          sleep 3
          echo "CREATE ROLE veylith_app LOGIN PASSWORD '${APP_PW}' NOSUPERUSER NOBYPASSRLS" | docker exec -i pg psql -v ON_ERROR_STOP=1 -U veylith -d veylith
      - run: ruff check app scripts tests
      - run: mypy app scripts --cache-dir=/tmp/mypy
      - run: pip-audit -r requirements.txt
      - name: "Tests (offline, no network access to NVD or CISA is needed)"
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: apps/web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          cp .env.example .env
          # throwaway credentials, generated for this run only
          sed -i "s/change-me-owner-password/$(openssl rand -hex 16)/; s/change-me-app-password/$(openssl rand -hex 16)/; s/change-me-to-a-long-random-value/$(openssl rand -hex 32)/" .env
          docker compose up -d --build
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm ci && npx playwright install --with-deps chromium && npx playwright test
        working-directory: tests/e2e
