# Veylith production stack. Single host, Docker Compose, HTTPS through Caddy.
#
#   cp .env.production.example .env      # then fill in every value
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Networking
#   public   Caddy, web, api            the only network that reaches the internet-facing proxy
#   backend  db, redis, api, workers    internal: no route to or from the internet
#   egress   worker, beat               outbound only, for the fixed NVD / CISA endpoints
# The database and Redis publish no ports. The PDF reporter has no egress network at all.

x-api-env: &api-env
  ENVIRONMENT: production
  DATABASE_URL: postgresql+psycopg://veylith_app:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
  MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  SECRET_KEY: ${SECRET_KEY}
  COOKIE_SECURE: "true"
  SESSION_COOKIE_NAME: __Host-veylith_session
  ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
  TRUSTED_ORIGINS: https://${VEYLITH_DOMAIN}
  SCHEDULED_INGESTION: "true"
  NVD_API_KEY: ${NVD_API_KEY:-}
  STORAGE_DIR: /data/storage

x-common: &common
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}

services:
  caddy:
    <<: *common
    image: caddy:2.8-alpine
    ports: ["80:80", "443:443"]
    environment:
      VEYLITH_DOMAIN: ${VEYLITH_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_add: ["NET_BIND_SERVICE"]
    networks: [public]
    depends_on: [web, api]

  web:
    <<: *common
    build:
      context: ../../apps/web
      args: {API_INTERNAL_URL: "http://api:8000"}
    environment:
      SESSION_COOKIE_NAME: __Host-veylith_session
    read_only: true
    tmpfs: ["/tmp", "/app/.next/cache"]
    networks: [public]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    <<: *common
    build: {context: ../../apps/api, target: prod}
    environment: *api-env
    read_only: true
    tmpfs: ["/tmp"]
    volumes: ["storage:/data"]
    networks: [public, backend]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *common
    build: {context: ../../apps/api, target: prod}
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "default", "-c", "2", "-l", "info"]
    environment: *api-env
    read_only: true
    tmpfs: ["/tmp"]
    volumes: ["storage:/data"]
    networks: [backend, egress]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  beat:
    <<: *common
    build: {context: ../../apps/api, target: prod}
    command: ["celery", "-A", "app.workers.celery_app", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]
    environment: *api-env
    read_only: true
    tmpfs: ["/tmp"]
    networks: [backend]
    depends_on:
      redis: {condition: service_healthy}

  reporter:
    <<: *common
    build: {context: ../../apps/api, dockerfile: Dockerfile.reporter}
    environment: *api-env
    read_only: true
    tmpfs: ["/tmp"]
    volumes: ["storage:/data"]
    mem_limit: 1g
    pids_limit: 256
    networks: [backend]            # no egress: PDF rendering must never reach the network
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  migrate:
    build: {context: ../../apps/api, target: prod}
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    restart: "no"
    networks: [backend]
    depends_on:
      db: {condition: service_healthy}

  db:
    <<: *common
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    networks: [backend]
    cap_drop: []   # the postgres entrypoint needs a few default capabilities to drop privileges
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *common
    image: redis:7.4-alpine
    user: redis   # start unprivileged so the entrypoint does not need setuid (capabilities are dropped)
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--save", "60", "1000"]
    volumes: ["redisdata:/data"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

networks:
  public: {}
  backend: {internal: true}
  egress: {}

volumes:
  pgdata:
  redisdata:
  storage:
  caddy_data:
  caddy_config:
